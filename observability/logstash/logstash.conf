input {
  file {
    path => "/artifacts/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/tmp/logstash-sincedb"
    codec => json
    mode => "tail"
  }
}

filter {
  if ![service_name] and [logger_name] {
    mutate {
      add_field => {
        "service_name" => "fop-converter-service"
      }
    }
  }

  ruby {
    code => '
      path = event.get("[log][file][path]")
      role = "unknown"

      if path
        role = File.basename(path).split(".").first
        role = "app" if role == "application"
      end

      event.set("service_role", role)
    '
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "fopconverter-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}