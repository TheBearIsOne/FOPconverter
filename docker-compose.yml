services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: fop-converter-service:local
    environment:
      SPRING_PROFILES_ACTIVE: local-dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NATS_URL: nats://nats:4222
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    volumes:
      - app-artifacts:/app/artifacts

  worker:
    image: fop-converter-service:local
    environment:
      SPRING_PROFILES_ACTIVE: local-dev,async-worker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NATS_URL: nats://nats:4222
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    volumes:
      - app-artifacts:/app/artifacts

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  app-artifacts:
