services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: fop-converter-service:local
    environment:
      SPRING_PROFILES_ACTIVE: local-dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOG_FILE_BASENAME: app
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    volumes:
      - app-artifacts:/app/artifacts

  worker:
    image: fop-converter-service:local
    environment:
      SPRING_PROFILES_ACTIVE: local-dev,async-worker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOG_FILE_BASENAME: worker
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    volumes:
      - app-artifacts:/app/artifacts

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"

  kibana:
    image: elastic/kibana:9.4.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.0
    environment:
      xpack.monitoring.enabled: "false"
    volumes:
      - ./observability/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - app-artifacts:/artifacts:ro
    depends_on:
      - elasticsearch

  observability-bootstrap:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.0
    command: ["bash", "/bootstrap/elastic-bootstrap.sh"]
    environment:
      ES_URL: http://elasticsearch:9200
      KIBANA_URL: http://kibana:5601
      DATA_VIEW_ID: fopconverter-logs
      DATA_VIEW_TITLE: fopconverter-logs-*
    volumes:
      - ./observability/bootstrap/elastic-bootstrap.sh:/bootstrap/elastic-bootstrap.sh:ro
    depends_on:
      - elasticsearch
      - kibana

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  app-artifacts:
